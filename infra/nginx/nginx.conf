events {}

http {
    # the two API instances running on the host machine, used in turns (round robin)
    upstream inat_api {
        server host.docker.internal:5092 max_fails=1 fail_timeout=10s;
        server host.docker.internal:5093 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://inat_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # if an instance is down, try the other one
            proxy_next_upstream error timeout http_502 http_503;
            proxy_read_timeout 60s;

            # shows which instance address answered, for checking
            add_header X-Upstream $upstream_addr always;
        }
    }
}