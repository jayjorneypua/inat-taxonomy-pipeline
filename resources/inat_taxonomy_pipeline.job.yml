resources:
  jobs:
    inat_taxonomy_pipeline:
      name: inat_taxonomy_pipeline
      max_concurrent_runs: 1

      permissions:
        - level: CAN_MANAGE
          user_name: jayjorneypua@gmail.com

      tasks:
        - task_key: download_taxa
          notebook_task:
            notebook_path: ../notebooks/01_download_taxa.py

        - task_key: bronze_taxa
          depends_on:
            - task_key: download_taxa
          notebook_task:
            notebook_path: ../notebooks/02_bronze_taxa.py

        - task_key: silver_taxa
          depends_on:
            - task_key: bronze_taxa
          notebook_task:
            notebook_path: ../notebooks/03_silver_taxa.sql

        - task_key: download_observations
          notebook_task:
            notebook_path: ../notebooks/04_download_observations.py

        - task_key: bronze_observations
          depends_on:
            - task_key: download_observations
          notebook_task:
            notebook_path: ../notebooks/05_bronze_observations.py

        - task_key: download_photos
          depends_on:
            - task_key: download_observations
          notebook_task:
            notebook_path: ../notebooks/06_download_photos.py

        - task_key: bronze_photos
          depends_on:
            - task_key: download_photos
          notebook_task:
            notebook_path: ../notebooks/07_bronze_photos.py